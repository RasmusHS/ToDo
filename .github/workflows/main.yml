name: PR

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

# Supersede in-flight runs when new commits are pushed to the same PR.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build & test
    # Skip draft PRs; ready_for_review triggers the run once it leaves draft.
    if: ${{ !github.event.pull_request.draft }}
    # ubuntu runners ship with a Docker daemon, which Testcontainers uses directly.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Checks out refs/pull/<n>/merge: the PR as it would look merged into master.
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ToDo.slnx

      - name: Build
        run: dotnet build ToDo.slnx --no-restore -c Release

      # Unit tests first: fast feedback, no Docker involved.
      - name: Unit tests
        run: >
          dotnet test ToDo.slnx --no-build -c Release
          --filter "FullyQualifiedName!~IntegrationTests"
          --logger "trx;LogFilePrefix=unit"
          --results-directory TestResults
          --collect:"XPlat Code Coverage"

      # Pre-pull so container startup isn't charged against test timeouts.
      - name: Pull Postgres image
        run: docker pull postgres:18

      - name: Integration tests
        run: >
          dotnet test src/Tests/ToDo.Api.IntegrationTests --no-build -c Release
          --logger "trx;LogFilePrefix=integration"
          --results-directory TestResults
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 7
