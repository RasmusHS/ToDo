services:
  todo.db:
    image: postgres:18
    container_name: todo.db
    environment:
      - POSTGRES_DB=todo
      - POSTGRES_USER=sa
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - ./.containers/db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa -d todo"]
      interval: 2s
      timeout: 3s
      retries: 15

  todo.api:
    ports:
      - "5295:8080"
      #- "7156:8081"
    pull_policy: build
    image: ${DOCKER_REGISTRY-}todoapi
    build:
      context: .
      dockerfile: ./src/ToDo.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=todo.db;Port=5432;Database=todo;Username=sa;Password=postgres;Include Error Detail=true
    depends_on:
      todo.db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
  
  todo.webapp:
    ports:
      - "5038:8080"
      #- "7235:8081"
    pull_policy: build
    image: ${DOCKER_REGISTRY-}todowebapp
    build:
      context: .
      dockerfile: ./src/ToDo.Webapp/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ApiSettings__BaseUrl=http://todo.api:8080
    depends_on:
      todo.db:
        condition: service_healthy
      todo.api:
        condition: service_healthy